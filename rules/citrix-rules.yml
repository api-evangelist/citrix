extends:
  - spectral:oas
rules:
  citrix-info-contact:
    description: API info MUST contain a contact email or URL.
    severity: warn
    given: $.info
    then:
      field: contact
      function: truthy
  citrix-https-only:
    description: All Citrix API servers MUST use HTTPS.
    severity: error
    given: $.servers[*].url
    then:
      function: pattern
      functionOptions:
        match: '^https://'
  citrix-operation-id:
    description: Operations MUST have an operationId.
    severity: error
    given: $.paths[*][get,post,put,delete,patch]
    then:
      field: operationId
      function: truthy
  citrix-tag-required:
    description: Operations MUST be tagged for product domain grouping.
    severity: warn
    given: $.paths[*][get,post,put,delete,patch].tags
    then:
      function: truthy
  citrix-security-required:
    description: API MUST define security schemes (OAuth 2.0 bearer for Citrix Cloud).
    severity: error
    given: $.components.securitySchemes
    then:
      function: truthy
  citrix-server-url:
    description: API MUST declare at least one server URL.
    severity: error
    given: $.servers
    then:
      function: truthy
  citrix-customer-id-templating:
    description: Customer-scoped Citrix Cloud paths SHOULD use templated customerId.
    severity: warn
    given: $.paths
    then:
      function: truthy
