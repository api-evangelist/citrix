capabilities:
  - id: citrix.deliver-virtual-desktops
    name: Deliver virtual apps and desktops
    description: >-
      Provision, manage, and monitor Citrix Virtual Apps and Desktops
      and DaaS deployments across on-premises and cloud sites.
    apis:
      - citrix:citrix-virtual-apps-and-desktops-rest-api
      - citrix:citrix-daas-rest-api
      - citrix:citrix-monitor-service-odata-api
  - id: citrix.manage-workspace
    name: Manage end-user workspace
    description: >-
      Customize the Citrix Workspace experience and StoreFront resource
      enumeration, session, and authentication flows.
    apis:
      - citrix:citrix-workspace-api
      - citrix:citrix-storefront-web-api
      - citrix:citrix-storefront-store-services-api
      - citrix:citrix-storefront-authentication-sdk
  - id: citrix.deliver-applications
    name: Deliver and load-balance applications
    description: >-
      Configure Citrix ADC (NetScaler) for application delivery,
      load balancing, and traffic management through the NITRO API.
    apis:
      - citrix:citrix-adc-netscaler-nitro-api
  - id: citrix.secure-access
    name: Secure access to applications
    description: >-
      Manage zero trust network access policies, application domains,
      and certificates with Citrix Secure Private Access.
    apis:
      - citrix:citrix-secure-private-access-api
  - id: citrix.manage-endpoints
    name: Manage mobile endpoints
    description: >-
      Manage mobile devices, applications, policies, and compliance
      through Citrix Endpoint Management.
    apis:
      - citrix:citrix-endpoint-management-rest-api
  - id: citrix.observe-environments
    name: Observe Citrix environments
    description: >-
      Access security, performance, and usage analytics across the
      Citrix portfolio.
    apis:
      - citrix:citrix-analytics-api
      - citrix:citrix-monitor-service-odata-api
  - id: citrix.manage-cloud-platform
    name: Manage Citrix Cloud platform
    description: >-
      Manage Citrix Cloud customers, resource locations, identity,
      service principals, and notifications at the platform layer.
    apis:
      - citrix:citrix-cloud-api
