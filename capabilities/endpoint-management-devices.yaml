naftiko: 1.0.0-alpha2
info:
  label: Citrix Endpoint Management REST API — Devices
  description: 'Citrix Endpoint Management REST API — Devices. 4 operations. Lead operation: Citrix Filter devices. Self-contained
    Naftiko capability covering one Citrix business surface.'
  tags:
  - Citrix
  - Devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CITRIX_API_KEY: CITRIX_API_KEY
capability:
  consumes:
  - type: http
    namespace: endpoint-management-devices
    baseUri: https://{xms-server}:4443/xenmobile/api/v1
    description: Citrix Endpoint Management REST API — Devices business capability. Self-contained, no shared references.
    resources:
    - name: device-filter
      path: /device/filter
      operations:
      - name: filterdevices
        method: POST
        description: Citrix Filter devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: device-selectivewipe
      path: /device/selectivewipe
      operations:
      - name: selectivewipedevice
        method: POST
        description: Citrix Selective wipe a device
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: device-wipe
      path: /device/wipe
      operations:
      - name: wipedevice
        method: POST
        description: Citrix Wipe a device
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: device-deviceId
      path: /device/{deviceId}
      operations:
      - name: getdevice
        method: GET
        description: Citrix Get device details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: deviceId
          in: path
          type: string
          description: Device unique identifier
          required: true
    authentication:
      type: apikey
      key: auth_token
      value: '{{env.CITRIX_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: endpoint-management-devices-rest
    port: 8080
    description: REST adapter for Citrix Endpoint Management REST API — Devices. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/device/filter
      name: device-filter
      description: REST surface for device-filter.
      operations:
      - method: POST
        name: filterdevices
        description: Citrix Filter devices
        call: endpoint-management-devices.filterdevices
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/device/selectivewipe
      name: device-selectivewipe
      description: REST surface for device-selectivewipe.
      operations:
      - method: POST
        name: selectivewipedevice
        description: Citrix Selective wipe a device
        call: endpoint-management-devices.selectivewipedevice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/device/wipe
      name: device-wipe
      description: REST surface for device-wipe.
      operations:
      - method: POST
        name: wipedevice
        description: Citrix Wipe a device
        call: endpoint-management-devices.wipedevice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/device/{deviceid}
      name: device-deviceid
      description: REST surface for device-deviceId.
      operations:
      - method: GET
        name: getdevice
        description: Citrix Get device details
        call: endpoint-management-devices.getdevice
        with:
          deviceId: rest.deviceId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: endpoint-management-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Citrix Endpoint Management REST API — Devices. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: citrix-filter-devices
      description: Citrix Filter devices
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: endpoint-management-devices.filterdevices
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: citrix-selective-wipe-device
      description: Citrix Selective wipe a device
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: endpoint-management-devices.selectivewipedevice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: citrix-wipe-device
      description: Citrix Wipe a device
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: endpoint-management-devices.wipedevice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: citrix-get-device-details
      description: Citrix Get device details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: endpoint-management-devices.getdevice
      with:
        deviceId: tools.deviceId
      outputParameters:
      - type: object
        mapping: $.
