naftiko: 1.0.0-alpha2
info:
  label: Citrix Cloud API — Authentication
  description: 'Citrix Cloud API — Authentication. 1 operations. Lead operation: Citrix Obtain access token. Self-contained
    Naftiko capability covering one Citrix business surface.'
  tags:
  - Citrix
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CITRIX_API_KEY: CITRIX_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-authentication
    baseUri: https://api.cloud.com
    description: Citrix Cloud API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: cctrustoauth2-customerId-tokens-clients
      path: /cctrustoauth2/{customerId}/tokens/clients
      operations:
      - name: getaccesstoken
        method: POST
        description: Citrix Obtain access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CITRIX_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-authentication-rest
    port: 8080
    description: REST adapter for Citrix Cloud API — Authentication. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/cctrustoauth2/{customerid}/tokens/clients
      name: cctrustoauth2-customerid-tokens-clients
      description: REST surface for cctrustoauth2-customerId-tokens-clients.
      operations:
      - method: POST
        name: getaccesstoken
        description: Citrix Obtain access token
        call: cloud-authentication.getaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Citrix Cloud API — Authentication. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: citrix-obtain-access-token
      description: Citrix Obtain access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-authentication.getaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
