naftiko: 1.0.0-alpha2
info:
  label: Citrix Secure Private Access API — Access Policies
  description: 'Citrix Secure Private Access API — Access Policies. 2 operations. Lead operation: Citrix List access policies.
    Self-contained Naftiko capability covering one Citrix business surface.'
  tags:
  - Citrix
  - Access Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CITRIX_API_KEY: CITRIX_API_KEY
capability:
  consumes:
  - type: http
    namespace: secure-private-access-access-policies
    baseUri: https://api.cloud.com/accessSecurity
    description: Citrix Secure Private Access API — Access Policies business capability. Self-contained, no shared references.
    resources:
    - name: policies
      path: /policies
      operations:
      - name: listaccesspolicies
        method: GET
        description: Citrix List access policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createaccesspolicy
        method: POST
        description: Citrix Create an access policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CITRIX_API_KEY}}'
  exposes:
  - type: rest
    namespace: secure-private-access-access-policies-rest
    port: 8080
    description: REST adapter for Citrix Secure Private Access API — Access Policies. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/policies
      name: policies
      description: REST surface for policies.
      operations:
      - method: GET
        name: listaccesspolicies
        description: Citrix List access policies
        call: secure-private-access-access-policies.listaccesspolicies
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createaccesspolicy
        description: Citrix Create an access policy
        call: secure-private-access-access-policies.createaccesspolicy
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: secure-private-access-access-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Citrix Secure Private Access API — Access Policies. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: citrix-list-access-policies
      description: Citrix List access policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: secure-private-access-access-policies.listaccesspolicies
      outputParameters:
      - type: object
        mapping: $.
    - name: citrix-create-access-policy
      description: Citrix Create an access policy
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: secure-private-access-access-policies.createaccesspolicy
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
