naftiko: 1.0.0-alpha2
info:
  label: Citrix DaaS REST API — Hypervisors
  description: 'Citrix DaaS REST API — Hypervisors. 1 operations. Lead operation: Citrix List hypervisor connections. Self-contained
    Naftiko capability covering one Citrix business surface.'
  tags:
  - Citrix
  - Hypervisors
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CITRIX_API_KEY: CITRIX_API_KEY
capability:
  consumes:
  - type: http
    namespace: daas-hypervisors
    baseUri: https://api.cloud.com/cvad/manage
    description: Citrix DaaS REST API — Hypervisors business capability. Self-contained, no shared references.
    resources:
    - name: Hypervisors
      path: /Hypervisors
      operations:
      - name: listhypervisors
        method: GET
        description: Citrix List hypervisor connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.CITRIX_API_KEY}}'
  exposes:
  - type: rest
    namespace: daas-hypervisors-rest
    port: 8080
    description: REST adapter for Citrix DaaS REST API — Hypervisors. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/hypervisors
      name: hypervisors
      description: REST surface for Hypervisors.
      operations:
      - method: GET
        name: listhypervisors
        description: Citrix List hypervisor connections
        call: daas-hypervisors.listhypervisors
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: daas-hypervisors-mcp
    port: 9090
    transport: http
    description: MCP adapter for Citrix DaaS REST API — Hypervisors. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: citrix-list-hypervisor-connections
      description: Citrix List hypervisor connections
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: daas-hypervisors.listhypervisors
      outputParameters:
      - type: object
        mapping: $.
