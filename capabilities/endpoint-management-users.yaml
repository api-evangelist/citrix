naftiko: 1.0.0-alpha2
info:
  label: Citrix Endpoint Management REST API — Users
  description: 'Citrix Endpoint Management REST API — Users. 1 operations. Lead operation: Citrix Filter users. Self-contained
    Naftiko capability covering one Citrix business surface.'
  tags:
  - Citrix
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CITRIX_API_KEY: CITRIX_API_KEY
capability:
  consumes:
  - type: http
    namespace: endpoint-management-users
    baseUri: https://{xms-server}:4443/xenmobile/api/v1
    description: Citrix Endpoint Management REST API — Users business capability. Self-contained, no shared references.
    resources:
    - name: user-filter
      path: /user/filter
      operations:
      - name: filterusers
        method: POST
        description: Citrix Filter users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: auth_token
      value: '{{env.CITRIX_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: endpoint-management-users-rest
    port: 8080
    description: REST adapter for Citrix Endpoint Management REST API — Users. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/user/filter
      name: user-filter
      description: REST surface for user-filter.
      operations:
      - method: POST
        name: filterusers
        description: Citrix Filter users
        call: endpoint-management-users.filterusers
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: endpoint-management-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Citrix Endpoint Management REST API — Users. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: citrix-filter-users
      description: Citrix Filter users
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: endpoint-management-users.filterusers
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
