naftiko: 1.0.0-alpha2
info:
  label: Citrix ADC (NetScaler) NITRO API — System
  description: 'Citrix ADC (NetScaler) NITRO API — System. 2 operations. Lead operation: Citrix Get system configuration.
    Self-contained Naftiko capability covering one Citrix business surface.'
  tags:
  - Citrix
  - System
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CITRIX_API_KEY: CITRIX_API_KEY
capability:
  consumes:
  - type: http
    namespace: adc-nitro-system
    baseUri: https://{netscaler-ip}/nitro/v1
    description: Citrix ADC (NetScaler) NITRO API — System business capability. Self-contained, no shared references.
    resources:
    - name: config-nsconfig
      path: /config/nsconfig
      operations:
      - name: getnsconfig
        method: GET
        description: Citrix Get system configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: stat-ns
      path: /stat/ns
      operations:
      - name: getsystemstats
        method: GET
        description: Citrix Get system statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: NITRO_AUTH_TOKEN
      value: '{{env.CITRIX_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: adc-nitro-system-rest
    port: 8080
    description: REST adapter for Citrix ADC (NetScaler) NITRO API — System. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/config/nsconfig
      name: config-nsconfig
      description: REST surface for config-nsconfig.
      operations:
      - method: GET
        name: getnsconfig
        description: Citrix Get system configuration
        call: adc-nitro-system.getnsconfig
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stat/ns
      name: stat-ns
      description: REST surface for stat-ns.
      operations:
      - method: GET
        name: getsystemstats
        description: Citrix Get system statistics
        call: adc-nitro-system.getsystemstats
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: adc-nitro-system-mcp
    port: 9090
    transport: http
    description: MCP adapter for Citrix ADC (NetScaler) NITRO API — System. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: citrix-get-system-configuration
      description: Citrix Get system configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: adc-nitro-system.getnsconfig
      outputParameters:
      - type: object
        mapping: $.
    - name: citrix-get-system-statistics
      description: Citrix Get system statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: adc-nitro-system.getsystemstats
      outputParameters:
      - type: object
        mapping: $.
