naftiko: 1.0.0-alpha2
info:
  label: Citrix DaaS REST API — Sessions
  description: 'Citrix DaaS REST API — Sessions. 4 operations. Lead operation: Citrix List sessions. Self-contained Naftiko
    capability covering one Citrix business surface.'
  tags:
  - Citrix
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CITRIX_API_KEY: CITRIX_API_KEY
capability:
  consumes:
  - type: http
    namespace: daas-sessions
    baseUri: https://api.cloud.com/cvad/manage
    description: Citrix DaaS REST API — Sessions business capability. Self-contained, no shared references.
    resources:
    - name: Sessions
      path: /Sessions
      operations:
      - name: listsessions
        method: GET
        description: Citrix List sessions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: Sessions-sessionId
      path: /Sessions/{sessionId}
      operations:
      - name: getsession
        method: GET
        description: Citrix Get a session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: Sessions-sessionId-$disconnect
      path: /Sessions/{sessionId}/$disconnect
      operations:
      - name: disconnectsession
        method: POST
        description: Citrix Disconnect a session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: Sessions-sessionId-$logoff
      path: /Sessions/{sessionId}/$logoff
      operations:
      - name: logoffsession
        method: POST
        description: Citrix Log off a session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.CITRIX_API_KEY}}'
  exposes:
  - type: rest
    namespace: daas-sessions-rest
    port: 8080
    description: REST adapter for Citrix DaaS REST API — Sessions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/sessions
      name: sessions
      description: REST surface for Sessions.
      operations:
      - method: GET
        name: listsessions
        description: Citrix List sessions
        call: daas-sessions.listsessions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sessions/{sessionid}
      name: sessions-sessionid
      description: REST surface for Sessions-sessionId.
      operations:
      - method: GET
        name: getsession
        description: Citrix Get a session
        call: daas-sessions.getsession
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sessions/{sessionid}/disconnect
      name: sessions-sessionid-disconnect
      description: REST surface for Sessions-sessionId-$disconnect.
      operations:
      - method: POST
        name: disconnectsession
        description: Citrix Disconnect a session
        call: daas-sessions.disconnectsession
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sessions/{sessionid}/logoff
      name: sessions-sessionid-logoff
      description: REST surface for Sessions-sessionId-$logoff.
      operations:
      - method: POST
        name: logoffsession
        description: Citrix Log off a session
        call: daas-sessions.logoffsession
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: daas-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Citrix DaaS REST API — Sessions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: citrix-list-sessions
      description: Citrix List sessions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: daas-sessions.listsessions
      outputParameters:
      - type: object
        mapping: $.
    - name: citrix-get-session
      description: Citrix Get a session
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: daas-sessions.getsession
      outputParameters:
      - type: object
        mapping: $.
    - name: citrix-disconnect-session
      description: Citrix Disconnect a session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: daas-sessions.disconnectsession
      outputParameters:
      - type: object
        mapping: $.
    - name: citrix-log-off-session
      description: Citrix Log off a session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: daas-sessions.logoffsession
      outputParameters:
      - type: object
        mapping: $.
