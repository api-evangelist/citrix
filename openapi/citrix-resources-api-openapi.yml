openapi: 3.2.0
info:
  title: Citrix StoreFront Web Resources API
  description: HTTP API for building custom client applications that authenticate users, enumerate available applications and desktops, manage HDX sessions, and launch resources from Citrix StoreFront.
  version: '1.0'
  contact:
    name: Citrix Support
    url: https://support.citrix.com/
  termsOfService: https://developer.cloud.com/citrix-developer-terms-of-use
servers:
- url: https://{storefront-server}/Citrix/Store
  description: StoreFront Server
  variables:
    storefront-server:
      default: storefront.example.com
      description: StoreFront server hostname
security:
- csrfToken: []
tags:
- name: Resources
  description: Enumerate available applications and desktops
paths:
  /Resources/List:
    post:
      operationId: listResources
      summary: Citrix List available resources
      description: Enumerate all applications and desktops available to the authenticated user.
      tags:
      - Resources
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum:
                  - json
                  - xml
                  description: Response format
                resourcesDetails:
                  type: string
                  enum:
                  - Default
                  - Full
                  description: Level of detail in response
      responses:
        '200':
          description: List of available resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcesResponse'
        '401':
          description: Not authenticated
components:
  parameters:
    CsrfToken:
      name: Csrf-Token
      in: header
      required: true
      description: CSRF token read from the session cookie
      schema:
        type: string
  schemas:
    Resource:
      type: object
      properties:
        id:
          type: string
          description: Resource identifier
        name:
          type: string
          description: Resource display name
        type:
          type: string
          enum:
          - Citrix.MPS.Application
          - Citrix.MPS.Desktop
          description: Resource type
        iconurl:
          type: string
          description: URL to the resource icon
        launchurl:
          type: string
          description: URL to launch the resource
        launchstatusurl:
          type: string
          description: URL to check launch readiness
    ResourcesResponse:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
          description: Available applications and desktops
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: Csrf-Token
      description: CSRF token from session cookie for POST requests
externalDocs:
  description: StoreFront Web API Documentation
  url: https://developer-docs.citrix.com/en-us/storefront/storefront-web-api/overview.html
