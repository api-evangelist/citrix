openapi: 3.2.0
info:
  title: Citrix Endpoint Management REST Policies API
  description: REST API for managing mobile devices, applications, and policies in Citrix Endpoint Management (formerly XenMobile), enabling integration with external systems for device lifecycle management and compliance.
  version: '1.0'
  contact:
    name: Citrix Support
    url: https://support.citrix.com/
  termsOfService: https://developer.cloud.com/citrix-developer-terms-of-use
servers:
- url: https://{xms-server}:4443/xenmobile/api/v1
  description: Citrix Endpoint Management Server
  variables:
    xms-server:
      default: xms.example.com
      description: XenMobile server hostname
security:
- authToken: []
tags:
- name: Policies
  description: Device and app policy management
paths:
  /device/policy/deploy:
    post:
      operationId: deployPolicy
      summary: Citrix Deploy policies to devices
      description: Deploy device or application policies to specified devices.
      tags:
      - Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - deviceIds
              properties:
                deviceIds:
                  type: array
                  items:
                    type: string
                  description: List of device IDs to receive the policy
      responses:
        '200':
          description: Policy deployment initiated
        '401':
          description: Unauthorized
components:
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: auth_token
      description: Authentication token from login endpoint
externalDocs:
  description: Citrix Endpoint Management REST APIs
  url: https://docs.citrix.com/en-us/citrix-endpoint-management/rest-apis.html
