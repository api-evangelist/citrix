openapi: 3.2.0
info:
  title: Citrix Endpoint Management REST Users API
  description: REST API for managing mobile devices, applications, and policies in Citrix Endpoint Management (formerly XenMobile), enabling integration with external systems for device lifecycle management and compliance.
  version: '1.0'
  contact:
    name: Citrix Support
    url: https://support.citrix.com/
  termsOfService: https://developer.cloud.com/citrix-developer-terms-of-use
servers:
- url: https://{xms-server}:4443/xenmobile/api/v1
  description: Citrix Endpoint Management Server
  variables:
    xms-server:
      default: xms.example.com
      description: XenMobile server hostname
security:
- authToken: []
tags:
- name: Users
  description: User and group management
paths:
  /user/filter:
    post:
      operationId: filterUsers
      summary: Citrix Filter users
      description: Search and filter users and groups.
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFilterRequest'
      responses:
        '200':
          description: Filtered user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  userListData:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
components:
  schemas:
    UserFilterRequest:
      type: object
      properties:
        start:
          type: integer
          description: Start index for pagination
        limit:
          type: integer
          description: Maximum number of results
        search:
          type: string
          description: Search text
    User:
      type: object
      properties:
        id:
          type: string
          description: User unique identifier
        userName:
          type: string
          description: Username
        displayName:
          type: string
          description: Display name
        email:
          type: string
          description: Email address
        domain:
          type: string
          description: Active Directory domain
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: auth_token
      description: Authentication token from login endpoint
externalDocs:
  description: Citrix Endpoint Management REST APIs
  url: https://docs.citrix.com/en-us/citrix-endpoint-management/rest-apis.html
