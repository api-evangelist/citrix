specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Citrix
providerId: citrix
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Application Delivery
  - Desktop-As-A-Service
  - Workspace
  - Rate Limiting
description: >-
  Citrix Cloud and Citrix DaaS REST APIs are governed by per-customer service throttles in the Citrix
  Cloud control plane. Specific per-second / per-minute thresholds are not published in self-serve
  form; clients should rely on HTTP 429 / Retry-After signaling and request increases via Citrix
  support. On-premises NetScaler / ADC NITRO and the Workspace API have their own throttling that is
  bounded by appliance / control-plane capacity.
notes: Verify exact thresholds inside the developer.cloud.com API reference and Citrix support
  channels. Numbers below are descriptive placeholders pending verification.
sources:
  - https://developer.cloud.com
  - https://docs.citrix.com/en-us/citrix-daas/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Citrix Cloud / DaaS REST API
    scope: customer
    metric: varies
    limit: see developer.cloud.com; per-service throttles applied per customer
  - name: NetScaler NITRO API
    scope: appliance
    metric: varies
    limit: bounded by NetScaler control-plane CPU; see Citrix ADC documentation
  - name: Workspace / StoreFront APIs
    scope: site
    metric: varies
    limit: see Citrix Workspace developer docs
policies:
  - name: Backoff Strategy
    description: Implement exponential backoff with jitter on HTTP 429/503 responses and honor any
      Retry-After header.
  - name: Bearer token reuse
    description: Cache Citrix Cloud bearer tokens until expiry; do not request a new token per call.
  - name: Pagination
    description: Use cursor / pagination parameters on list endpoints rather than polling full
      collections.
  - name: Limit increase
    description: Production tenants requiring higher throughput should engage Citrix support with the
      Customer ID and traffic profile.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
