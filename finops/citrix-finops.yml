description: >-
  FOCUS-aligned FinOps shape for Citrix. Cost is driven by per-user / per-device subscriptions
  (Citrix Platform License, Citrix DaaS tiers) and per-instance NetScaler / App Delivery licenses,
  plus underlying cloud compute / storage in customer-owned hyperscaler subscriptions when DaaS
  resource locations run in AWS, Azure, or GCP.
notes: Underlying hyperscaler compute / storage / egress for DaaS resource locations is billed
  separately by AWS / Azure / GCP and should be tracked through those providers' FinOps surfaces.
sources:
  - https://www.citrix.com/products/
  - https://docs.citrix.com/en-us/citrix-daas/
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Citrix
  ServiceCategory: End-User Computing
  ProviderName: Citrix
  PublisherName: Cloud Software Group, Inc.
  InvoiceIssuerName: Cloud Software Group, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: citrix_user_subscription
    description: Per-user / per-device subscription to Citrix Platform License or DaaS tiers.
    unit: user-month
    aggregation: max
    dimensions:
      - tier
      - sku
      - region
  - name: netscaler_throughput
    description: NetScaler ADC throughput tier or vCPU entitlement.
    unit: instance-month
    aggregation: max
    dimensions:
      - tier
      - form_factor
      - region
  - name: hyperscaler_compute
    description: Underlying VM compute hours used by Citrix DaaS resource locations on AWS / Azure /
      GCP.
    unit: instance-hour
    aggregation: sum
    dimensions:
      - cloud
      - instance_type
      - region
  - name: hyperscaler_storage
    description: Persistent disk / image storage in DaaS resource locations.
    unit: GB-month
    aggregation: max
    dimensions:
      - cloud
      - storage_class
      - region
principles:
  - name: Visibility
    description: Use Citrix Cloud Licensing dashboards plus Citrix Analytics for Performance to
      observe license activation and session utilization; pair with hyperscaler cost reports for the
      underlying DaaS compute footprint.
  - name: Allocation
    description: Tag Citrix users to cost centers via Active Directory / Citrix Cloud user groups and
      tag DaaS resource-location resources in the underlying cloud account for chargeback.
  - name: Optimization
    description: Right-size DaaS machine catalogs using autoscale, schedule power management, choose
      the appropriate Citrix tier (Standard vs Premium), and use hyperscaler reserved or savings-
      plan commitments for steady-state DaaS workloads.
  - name: Accountability
    description: End-user computing platform owner is accountable for Citrix license forecasting,
      term-renewal cadence, and DaaS resource-location FinOps coordination with cloud platform teams.
