name: Citrix
description: >-
  APIs for Citrix virtual desktop infrastructure, networking, and workspace solutions.
image: 
  https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
url: https://developer.citrix.com
created: '2024'
modified: '2026-03-04'
specificationVersion: '0.18'
tags:
  - virtualization
  - desktop-as-a-service
  - workspace
  - networking
  - application delivery
apis:
  - name: Citrix Virtual Apps and Desktops REST API
    description: >-
      Manage and monitor Citrix Virtual Apps and Desktops deployments.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: https://developer.citrix.com/citrix-virtual-apps-and-desktops
    baseURL: https://{customer-id}.xendesktop.net
    tags:
      - virtual desktop
      - VDI
      - remote access
    properties:
      - type: Documentation
        url: 
          https://developer.citrix.com/citrix-virtual-apps-and-desktops/citrix-cvad-rest-apis
      - type: OpenAPI
        url: 
          https://developer.citrix.com/citrix-virtual-apps-and-desktops/citrix-cvad-rest-apis/docs/openapi
      - type: Authentication
        url: 
          https://developer.citrix.com/citrix-virtual-apps-and-desktops/citrix-cvad-rest-apis/docs/how-to-get-started
      - type: OpenAPI
        url: openapi/citrix-daas-openapi.yml
  - name: Citrix Workspace API
    description: >-
      Integrate and customize Citrix Workspace for end users.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: https://developer.citrix.com/citrix-workspace
    baseURL: https://api.cloud.com
    tags:
      - workspace
      - SSO
      - user experience
    properties:
      - type: Documentation
        url: 
          https://developer.citrix.com/citrix-workspace/citrix-workspace-platform
      - type: API Reference
        url: 
          https://developer.citrix.com/citrix-workspace/citrix-workspace-platform/build/api-reference
  - name: Citrix ADC (NetScaler) NITRO API
    description: >-
      Configure and monitor Citrix ADC application delivery controllers.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: https://developer.citrix.com/citrix-adc
    baseURL: https://{netscaler-ip}/nitro/v1
    tags:
      - load balancing
      - application delivery
      - networking
      - ADC
    properties:
      - type: Documentation
        url: 
          https://developer-docs.citrix.com/projects/netscaler-nitro-api/en/latest/
      - type: API Reference
        url: 
          https://developer-docs.citrix.com/projects/netscaler-nitro-api/en/latest/api-reference/
      - type: SDK
        url: 
          https://developer-docs.citrix.com/projects/netscaler-nitro-api/en/latest/getting-started/
      - type: OpenAPI
        url: openapi/citrix-adc-nitro-openapi.yml
  - name: Citrix DaaS REST API
    description: >-
      Manage Citrix Desktop as a Service (DaaS) cloud deployments.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: https://developer.citrix.com/citrix-daas
    baseURL: https://api.cloud.com/cvad
    tags:
      - DaaS
      - cloud
      - desktop as a service
    properties:
      - type: Documentation
        url: https://developer.citrix.com/citrix-daas/citrix-daas-rest-apis
      - type: OpenAPI
        url: 
          https://developer.citrix.com/citrix-daas/citrix-daas-rest-apis/docs/openapi
      - type: Getting Started
        url: 
          https://developer.citrix.com/citrix-daas/citrix-daas-rest-apis/docs/getting-started
      - type: OpenAPI
        url: openapi/citrix-daas-openapi.yml
  - name: Citrix Analytics API
    description: >-
      Access analytics data for security and performance insights.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: https://developer.citrix.com/citrix-analytics
    baseURL: https://api.analytics.cloud.com
    tags:
      - analytics
      - security
      - monitoring
      - insights
    properties:
      - type: Documentation
        url: https://developer.citrix.com/citrix-analytics/api-overview
      - type: API Reference
        url: https://developer.citrix.com/citrix-analytics/api-reference
  - name: Citrix Cloud API
    description: >-
      Platform-level API for managing Citrix Cloud services, including
      authentication, service principals, resource locations, and
      notifications across the Citrix Cloud platform.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: 
      https://developer-docs.citrix.com/en-us/citrix-cloud/citrix-cloud-api-overview/get-started-with-citrix-cloud-apis.html
    baseURL: https://api.cloud.com
    tags:
      - Cloud
      - Platform
      - Identity
      - Management
    properties:
      - type: Documentation
        url: 
          https://developer-docs.citrix.com/en-us/citrix-cloud/citrix-cloud-api-overview/get-started-with-citrix-cloud-apis.html
      - type: Getting Started
        url: 
          https://developer-docs.citrix.com/en-us/citrix-cloud/citrix-cloud-api-overview/citrix-cloud-api-walkthrough.html
      - type: Authentication
        url: 
          https://developer-docs.citrix.com/en-us/citrix-cloud/citrix-cloud-api-overview/get-started-with-citrix-cloud-apis.html
      - type: OpenAPI
        url: openapi/citrix-cloud-openapi.yml
  - name: Citrix Monitor Service OData API
    description: >-
      OData-based API for querying monitoring data from Citrix Virtual Apps
      and Desktops deployments, including session, connection, machine, and
      application usage data for reporting and analytics.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: 
      https://developer-docs.citrix.com/en-us/monitor-service-odata-api/overview.html
    baseURL: https://{delivery-controller}/Citrix/Monitor/OData/v4/Data
    tags:
      - Monitoring
      - OData
      - Analytics
      - Reporting
    properties:
      - type: Documentation
        url: 
          https://developer-docs.citrix.com/en-us/monitor-service-odata-api/overview.html
      - type: Reference
        url: 
          https://developer-docs.citrix.com/en-us/monitor-service-odata-api/monitor-service-resources.html
      - type: Getting Started
        url: 
          https://developer-docs.citrix.com/en-us/monitor-service-odata-api/access-methods.html
  - name: Citrix StoreFront Web API
    description: >-
      HTTP API for building custom client applications that authenticate
      users, enumerate available applications and desktops, manage HDX
      sessions, and launch resources from Citrix StoreFront.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: 
      https://developer-docs.citrix.com/en-us/storefront/storefront-web-api/overview.html
    baseURL: https://{storefront-server}/Citrix/Store
    tags:
      - StoreFront
      - Client
      - Sessions
      - Resources
    properties:
      - type: Documentation
        url: 
          https://developer-docs.citrix.com/en-us/storefront/storefront-web-api/overview.html
      - type: Getting Started
        url: 
          https://developer-docs.citrix.com/en-us/storefront/storefront-web-api/getting-started.html
      - type: Reference
        url: 
          https://developer-docs.citrix.com/en-us/storefront/storefront-web-api/apis/
      - type: OpenAPI
        url: openapi/citrix-storefront-web-openapi.yml
  - name: Citrix StoreFront Store Services API
    description: >-
      Server-side API for customizing and extending the Citrix StoreFront
      store services, including endpoint management, authentication, and
      resource enumeration behaviors.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: 
      https://developer-docs.citrix.com/en-us/storefront/storefront-store-services-api/overview.html
    baseURL: https://{storefront-server}/Citrix/Store
    tags:
      - StoreFront
      - Server
      - Customization
    properties:
      - type: Documentation
        url: 
          https://developer-docs.citrix.com/en-us/storefront/storefront-store-services-api/overview.html
      - type: Reference
        url: 
          https://developer-docs.citrix.com/en-us/storefront/storefront-store-services-api/endpoints-service/
  - name: Citrix StoreFront Authentication SDK
    description: >-
      SDK for building custom authentication methods for Citrix StoreFront,
      allowing integration with third-party identity providers and custom
      authentication workflows.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: 
      https://developer-docs.citrix.com/en-us/storefront/citrix-storefront-authentication-sdk/overview.html
    baseURL: https://{storefront-server}
    tags:
      - StoreFront
      - Authentication
      - Identity
    properties:
      - type: Documentation
        url: 
          https://developer-docs.citrix.com/en-us/storefront/citrix-storefront-authentication-sdk/overview.html
  - name: Citrix Endpoint Management REST API
    description: >-
      REST API for managing mobile devices, applications, and policies in
      Citrix Endpoint Management, enabling integration with external systems
      for device lifecycle management and compliance.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: 
      https://docs.citrix.com/en-us/citrix-endpoint-management/rest-apis.html
    baseURL: https://{xms-server}:4443/xenmobile/api/v1
    tags:
      - Endpoint Management
      - Mobile
      - MDM
      - UEM
    properties:
      - type: Documentation
        url: 
          https://docs.citrix.com/en-us/citrix-endpoint-management/rest-apis.html
      - type: OpenAPI
        url: openapi/citrix-endpoint-management-openapi.yml
  - name: Citrix Secure Private Access API
    description: >-
      REST API for managing zero trust network access policies, applications,
      application domains, and certificates in Citrix Secure Private Access,
      providing secure access to internal web and SaaS applications.
    image: 
      https://www.citrix.com/content/dam/citrix/en_us/images/logos/citrix-logo.png
    humanURL: 
      https://developer-docs.citrix.com/en-us/secure-private-access/access-security/overview.html
    baseURL: https://api.cloud.com/accessSecurity
    tags:
      - Zero Trust
      - Security
      - Access Control
      - ZTNA
    properties:
      - type: Documentation
        url: 
          https://developer-docs.citrix.com/en-us/secure-private-access/access-security/overview.html
      - type: Getting Started
        url: 
          https://developer-docs.citrix.com/en-us/secure-private-access/access-security/getting-started.html
      - type: OpenAPI
        url: openapi/citrix-secure-private-access-openapi.yml
