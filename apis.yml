aid: citrix
name: Citrix
description: >-
  Citrix is a global software company providing virtualization, networking, workspace, and digital experience products
  that allow organizations to deliver applications and desktops securely from data centers and clouds to any device.
  Citrix exposes its programmable surface through the Citrix Cloud platform and developer.citrix.com /
  developer-docs.citrix.com, with REST APIs spanning Virtual Apps and Desktops, DaaS, Workspace, Citrix Cloud, ADC
  (NetScaler) NITRO, Endpoint Management, Secure Private Access, and Analytics. Authentication uses OAuth 2.0 bearer
  tokens issued through Citrix Cloud customer-id-scoped credentials.
