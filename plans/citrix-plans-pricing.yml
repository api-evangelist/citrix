specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Citrix
providerId: citrix
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Application Delivery
  - Desktop-As-A-Service
  - Virtualization
  - Workspace
  - Networking
description: >-
  Citrix (Cloud Software Group) sells its workspace, DaaS, application-delivery, and networking
  products through a Citrix Platform License (CPL) and product-specific subscriptions (Citrix DaaS
  Standard / Advanced / Advanced Plus / Premium / Premium Plus, Citrix App Delivery, NetScaler).
  Following the 2022 Cloud Software Group acquisition, Citrix moved to a partner-quote model;
  per-user-per-month pricing is no longer self-serve on citrix.com and must be obtained from a
  Citrix authorized partner. The Citrix Cloud / DaaS REST APIs are bundled with the parent
  subscription.
notes: No public per-user price list. Replace with negotiated list pricing once available from a
  Citrix authorized partner. Citrix discontinued perpetual licensing for most products in 2023; new
  customers buy term subscriptions.
sources:
  - https://www.citrix.com/products/
  - https://www.citrix.com/products/citrix-daas/
  - https://www.citrix.com/products/citrix-platform-license/
  - https://developer.cloud.com
plans:
  - id: citrix-platform-license
    name: Citrix Platform License (CPL)
    type: enterprise
    description: Bundles core Citrix workspace and delivery capabilities. Includes Citrix DaaS,
      Workspace, Secure Private Access, and Analytics components — exact composition varies by SKU
      and term.
    entries:
      - label: Per user / device subscription
        name: cpl
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact Citrix authorized partner
        userMultiplied: true
    elements:
      - name: Citrix DaaS
      - name: Citrix Workspace
      - name: Secure Private Access
      - name: Analytics for Performance / Security
      - name: Citrix Cloud REST APIs
  - id: citrix-daas
    name: Citrix DaaS (Standard / Advanced / Premium)
    type: subscription
    description: Cloud-managed virtual apps and desktops. Tiers add features such as Workspace, App
      Layering, App Protection, hybrid rights, and analytics.
    entries:
      - label: Per user / device subscription
        name: daas
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact Citrix authorized partner
        userMultiplied: true
    elements:
      - name: Cloud-hosted control plane
      - name: HDX delivery protocol
      - name: Workspace app
      - name: App Layering (Advanced+)
      - name: App Protection (Premium)
      - name: Citrix Cloud REST APIs
  - id: citrix-app-delivery
    name: Citrix App Delivery & Security
    type: subscription
    description: Application delivery, load balancing, and WAF capabilities (formerly NetScaler ADC),
      offered as software, hardware, or SaaS.
    entries:
      - label: Per instance / vCPU / throughput tier
        name: appdelivery
        type: subscription
        metric: instance
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact Citrix authorized partner
        userMultiplied: false
    elements:
      - name: Load balancing
      - name: GSLB / multi-cloud
      - name: WAF / bot management
      - name: API gateway
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
